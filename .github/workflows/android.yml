name: Build Android ARM64 Library
run-name: ${{ github.actor }} is building libbcn_layer.so

on:
    push:
        branches: ["**"]
        tags: ["*"]
    pull_request:
        branches: ["**"]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Install System Dependencies
              run: |
                  sudo apt-get update 
                  sudo apt-get install -y --no-install-recommends \
                    openjdk-17-jre-headless \
                    glslang-tools \
                    glslc \
                    xxd \
                    libvulkan-dev \
                    glibc-source

            - name: Install Slang Compiler
              run: |
                  curl -L https://github.com/shader-slang/slang/releases/download/v2026.10.2/slang-2026.10.2-linux-x86_64.tar.gz -o slang.tar.gz
                  mkdir -p slang_extracted
                  tar -xzf slang.tar.gz -C slang_extracted
                  sudo cp slang_extracted/bin/slangc /usr/local/bin/
                  sudo cp slang_extracted/lib/*.so* /usr/local/lib/
                  sudo ldconfig /usr/local/lib
                  rm -rf slang.tar.gz slang_extracted

            - name: Install Mali Offline Compiler
              run: |
                  curl -L https://github.com/leegao/bcn_layer/releases/download/MOC/moc.zip -o moc.zip
                  sudo mkdir -p /opt/moc
                  sudo unzip moc.zip -d /opt/moc
                  ls /opt/moc

            # - name: Install Android NDK Minimal
            #   run: |
            #       curl -L https://dl.google.com/android/repository/android-ndk-r26b-linux.zip -o ndk.zip
            #       unzip -q ndk.zip -d /opt
            #       rm ndk.zip
            #       echo "ANDROID_NDK_HOME=/opt/android-ndk-r26b" >> "$GITHUB_ENV"

            - name: Checkout source code
              uses: actions/checkout@v6

            - name: Configure CMake for Android ARM64
              run: |
                  cmake -B build \
                    -DCMAKE_SYSTEM_NAME=Android \
                    -DANDROID_PLATFORM=26 \
                    -DANDROID_ABI=arm64-v8a \
                    -DANDROID_TOOLCHAIN=clang \
                    -DANDROID_STL=c++_static \
                    -DCMAKE_BUILD_TYPE=Release \
                    -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
                    -DFORCE_GLSL=OFF

            - name: Build bcn_layer for Android ARM64
              run: cmake --build build --config Release --target bcn_layer

            - name: Upload libbcn_layer.so for Android ARM64
              uses: actions/upload-artifact@v6
              with:
                  name: libbcn_layer.so
                  path: build/libbcn_layer.so

            - name: Upload astc_encoder
              uses: actions/upload-artifact@v6
              with:
                  name: astc_encoder
                  path: build/src/astc_encoder.*

            - name: Run malioc on astc_encoder.spv
              run: |
                  /opt/moc/mali_offline_compiler/malioc -c Mali-G615 -d --vulkan build/src/astc_encoder.spv | tee malioc_output.txt
                  echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
                  cat malioc_output.txt >> $GITHUB_STEP_SUMMARY
                  echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
